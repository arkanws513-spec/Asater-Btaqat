name: Validate game source
on:
  push:
    branches: [main, realtime-combat]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check realtime.js
      - name: Check required game files
        run: |
          test -s index.html
          test -s realtime.html
          test -s realtime.css
          test -s realtime.js
      - name: Check local asset references
        run: |
          grep -q 'href="realtime.css"' realtime.html
          grep -q 'src="realtime.js"' realtime.html
          grep -q 'realtime.html' index.html
